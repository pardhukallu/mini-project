services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shadowwatch
      POSTGRES_USER: shadowwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "5432:5432"
    volumes:
      - shadowwatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowwatch -d shadowwatch"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shadowwatch_pgdata:
